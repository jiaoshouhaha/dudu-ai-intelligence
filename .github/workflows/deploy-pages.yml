name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['Update AI news']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare static site
        run: |
          node scripts/build-site-meta.mjs
          mkdir -p public/data/news
          cp data/index.json data/lookup.json data/search-index.json data/archive.json data/trends.json data/status.json data/topic-index.json public/data/
          if [ -f data/model-rankings.json ]; then cp data/model-rankings.json public/data/; fi
          cp data/news/*.json public/data/news/
          rm -f public/data/search.json public/data/seen.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
