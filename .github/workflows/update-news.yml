name: Update AI news

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
      MAX_NEW_ITEMS_PER_RUN: '80'
      RETENTION_DAYS: '365'
      TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
      TRANSLATION_CONCURRENCY: '3'
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test pipeline
        run: pnpm test

      - name: Fetch and process news
        run: pnpm fetch

      - name: Commit updated data
        run: |
          if git diff --quiet -- data; then
            echo "No news data changes"
            exit 0
          fi
          git config user.name "signal-ai-bot"
          git config user.email "signal-ai-bot@users.noreply.github.com"
          git add data
          git commit -m "data: update AI news"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
