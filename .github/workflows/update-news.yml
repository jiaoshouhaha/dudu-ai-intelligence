name: Update AI news

on:
  schedule:
    # UTC times correspond to Asia/Shanghai 01:00, 07:00, 12:30 and 19:00.
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
    - cron: '30 4 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_DAILY_LIMIT: ${{ vars.DEEPSEEK_DAILY_LIMIT }}
      MAX_NEW_ITEMS_PER_RUN: '80'
      NEWS_WINDOW_HOURS: '36'
      TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
      TRANSLATION_CONCURRENCY: '3'
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test pipeline
        run: pnpm test

      - name: Fetch and process news
        run: pnpm fetch

      - name: Commit updated data
        run: |
          if git diff --quiet -- data; then
            echo "No news data changes"
            exit 0
          fi
          git config user.name "signal-ai-bot"
          git config user.email "signal-ai-bot@users.noreply.github.com"
          git add data
          git commit -m "data: update AI news"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
