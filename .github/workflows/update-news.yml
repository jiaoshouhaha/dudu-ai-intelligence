name: Update AI news

on:
  schedule:
    # GitHub cron is best-effort. Running off the top of the hour reduces queue delays.
    - cron: '2,32 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep each scheduled run inexpensive even as the discovery source pool grows.
      MAX_NEW_ITEMS_PER_RUN: '12'
      DEEPSEEK_DAILY_LIMIT: '12'
      NEWS_WINDOW_HOURS: '4320'
      TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
      TRANSLATION_CONCURRENCY: '3'
      NODE_USE_ENV_PROXY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test pipeline
        run: pnpm test

      - name: Refresh model rankings
        continue-on-error: true
        run: pnpm run rankings

      - name: Fetch and process news
        run: pnpm run fetch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}

      - name: Commit updated data
        run: |
          if git diff --quiet -- data; then
            echo "No news or ranking data changes"
            exit 0
          fi
          git config user.name "signal-ai-bot"
          git config user.email "signal-ai-bot@users.noreply.github.com"
          git add data
          git commit -m "data: update AI intelligence"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
